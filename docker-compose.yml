services:
  metarankings-api:
    image: metarankings-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - metarankings-api-network
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:3000"
      ConnectionStrings__PostgresConnection: Host=db; Port=5432; Database=${DB_NAME}; Trust Server Certificate=true; Username=${DB_USER}; Password=${DB_PASSWORD}
    volumes:
      - ./Games:/app/Games
      - ./Movies:/app/Movies
    restart: unless-stopped

  db:
    image: postgres:17
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - metarankings-api-network
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "${DB_NAME}"
    restart: unless-stopped
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - metarankings-api-network
    depends_on:
      - db
      - metarankings-api
    restart: unless-stopped

networks:
  metarankings-api-network:
    driver: bridge

volumes:
  postgres_data: