services:
  metarankings-api:
    image: metarankings-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - metarankings-api-network
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:3000"
      ConnectionStrings__PostgresConnection: Host=db; Port=5432; Database=${DB_NAME}; Trust Server Certificate=true; Username=${DB_USER}; Password=${DB_PASSWORD}
      ConnectionStrings__RedisConnection: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
    volumes:
      - ./Games:/app/Games
      - ./Movies:/app/Movies
    restart: unless-stopped

  db:
    image: postgres:17
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - metarankings-api-network
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "${DB_NAME}"
    restart: unless-stopped
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - metarankings-api-network
    restart: unless-stopped
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./BlazorClient/wwwroot:/usr/share/nginx/html:ro
    networks:
      - metarankings-api-network
    depends_on:
      - db
      - metarankings-api
    restart: unless-stopped

networks:
  metarankings-api-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: