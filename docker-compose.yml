version: "3.8"

networks:
  myAppNetwork:
    driver: bridge

volumes:
  postgres_data:

services:
  db:
    image: postgres:17.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: borisgarin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: Metarankings
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U borisgarin || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/borisgarin01/metarankings-api:v1 # <- ваш реестр/имя/тег
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__DefaultConnection: Host=db;Database=Metarankings;Username=borisgarin;Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
