---
- name: Common bootstrap (apt + docker)
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - role: geerlingguy.docker
      vars:
        docker_users: ["{{ ansible_user }}"]

# DB
- name: Deploy Postgres
  hosts: db
  become: true

  tasks:
    - name: Create postgres data directory
      ansible.builtin.file:
        path: /srv/postgres/data
        state: directory
        mode: "0755"

    - name: Run PostgreSQL
      community.docker.docker_container:
        name: postgres
        image: postgres:17
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ db_port }}:5432"
        volumes:
          - /srv/postgres/data:/var/lib/postgresql/data
        env:
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
          POSTGRES_DB: "{{ db_name }}"

# REDIS
- name: Deploy Redis
  hosts: redis
  become: true

  tasks:
    - name: Create redis data directory
      ansible.builtin.file:
        path: /srv/redis/data
        state: directory
        mode: "0755"

    - name: Run Redis
      community.docker.docker_container:
        name: redis
        image: redis:7.4-alpine
        state: started
        restart_policy: unless-stopped
        command: ["redis-server", "--requirepass", "{{ redis_password }}", "--appendonly", "yes"]
        ports:
          - "{{ redis_bind_address }}:{{ redis_port }}:6379"
        volumes:
          - /srv/redis/data:/data

# API
- name: Deploy API
  hosts: api
  become: true

  tasks:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}/src"
        state: directory
        mode: "0755"

    - name: Copy source code
      ansible.posix.synchronize:
        src: ../src/
        dest: "{{ app_dir }}/src/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.vs"
          - "--exclude=node_modules"
          - "--exclude=bin"
          - "--exclude=obj"
        delete: yes

    - name: Build API image
      community.docker.docker_image:
        name: metarankings-api
        source: build
        build:
          path: "{{ app_dir }}/src"
        state: present
        force_source: true

    - name: Run API container
      community.docker.docker_container:
        name: metarankings-api
        image: metarankings-api
        state: started
        recreate: yes
        restart_policy: unless-stopped
        ports:
          - "{{ api_port }}:3000"
        etc_hosts:
          host.docker.internal: host-gateway
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: "http://0.0.0.0:3000"
          ConnectionStrings__PostgresConnection: "Host={{ db_host }}; Port={{ db_port }}; Database={{ db_name }}; Username={{ db_user }}; Password={{ db_password }}"
          ConnectionStrings__RedisConnection: "{{ redis_host }}:{{ redis_port }},password={{ redis_password }},abortConnect=false"

# PROXY
- name: Deploy Nginx proxy
  hosts: proxy
  become: true

  tasks:
    - name: Stop nginx before certbot
      community.docker.docker_container:
        name: nginx
        state: stopped
      ignore_errors: true

    - name: Install Certbot and generate certificate
      ansible.builtin.include_role:
        name: geerlingguy.certbot

    - name: Create nginx directory
      ansible.builtin.file:
        path: "{{ app_dir }}/nginx"
        state: directory
        mode: "0755"

    - name: Generate nginx config
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: "{{ app_dir }}/nginx/nginx.conf"
        mode: "0644"

    - name: Run Nginx
      community.docker.docker_container:
        name: nginx
        image: nginx:alpine
        state: started
        restart_policy: unless-stopped
        ports:
          - "80:80"
          - "443:443"
        etc_hosts:
          host.docker.internal: host-gateway
        volumes:
          - "{{ app_dir }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          - /etc/letsencrypt:/etc/letsencrypt:ro