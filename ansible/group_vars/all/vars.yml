---

app_dir: /opt/metarankings-api

# Domain
domain: rankings-meta.ru
certbot_email: boris.garin01@mail.ru

# Service addresses (for containers use host.docker.internal)
db_host: host.docker.internal
db_port: 5432
db_name: metarankings
db_user: borisgarin
db_password: A7XEntertainment

# Redis слушает только на docker-bridge хоста (host-gateway), наружу порт не открыт
redis_host: host.docker.internal
redis_port: 6379
redis_bind_address: 172.17.0.1

api_host: host.docker.internal
api_port: 3000

# Docker
docker_users:
  - "{{ ansible_user }}"

# Certbot
certbot_install_method: snap
certbot_auto_renew: true
certbot_auto_renew_hour: "3"
certbot_auto_renew_minute: "30"
certbot_create_if_missing: true
certbot_create_method: standalone
certbot_admin_email: "{{ certbot_email }}"
certbot_certs:
  - email: "{{ certbot_email }}"
    domains:
      - "{{ domain }}"